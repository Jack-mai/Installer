# 3 master (control-plane) + 3 worker - Ubuntu 22.04
[masters]
k8s-master1 ansible_host=10.10.90.141
k8s-master2 ansible_host=10.10.90.142
k8s-master3 ansible_host=10.10.90.143

[workers]
k8s-worker1 ansible_host=10.10.90.144
k8s-worker2 ansible_host=10.10.90.145
k8s-worker3 ansible_host=10.10.90.146

[k8s_cluster:children]
masters
workers

[k8s_cluster:vars]
# User SSH vào các node (có quyền sudo)
ansible_user=administrator
# Bỏ comment nếu dùng key riêng / sudo cần mật khẩu
ansible_ssh_private_key_file=~/.ssh/id_rsa_ansible
# ansible_become_password=YOUR_SUDO_PASSWORD
